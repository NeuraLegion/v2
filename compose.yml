services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: miniflux
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.bright
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      DATABASE_URL: postgres://postgres:postgres@db:5432/miniflux?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true

volumes:
  db-data:
