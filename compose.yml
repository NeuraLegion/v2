services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: miniflux
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.bright
    ports:
      - "8080:8080"
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://miniflux:secret@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test123
      LOG_LEVEL: info
      LOG_FILE: stderr
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db-data:
